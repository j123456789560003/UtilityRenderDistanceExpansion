on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: windows-latest
    env:
      URDE_LL_VERSION: ${{ matrix.ll_version }}
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        ll_version:
          - "26.60.2"
          - "26.51.9"
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.ll_version }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ matrix.ll_version }}-

      - name: Setup LLVM
        uses: Zhongruoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} --ll_version=${{ matrix.ll_version }} -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-${{ matrix.ll_version }}-windows-x64
          path: |
            bin/${{ matrix.target_type }}/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        ll_version:
          - "26.60.2"
          - "26.51.9"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-${{ matrix.ll_version }}-windows-x64
          path: artifact

      - run: |
          cp CHANGELOG.md LICENSE README.md artifact/

      - name: Package release asset
        run: |
          SUFFIX=""
          if [ "${{ matrix.ll_version }}" != "26.60.2" ]; then
            SUFFIX="-ll${{ matrix.ll_version }}"
          fi
          ASSET="${{ github.event.repository.name }}-${{ matrix.target_type }}-windows-x64${SUFFIX}.zip"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          (cd artifact && zip -r "../$ASSET" *)

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
